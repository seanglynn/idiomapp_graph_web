name: CI

on:
  push:
  pull_request:

concurrency:
  # A newer push to the same ref supersedes an in-flight run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # No API keys are needed: every provider SDK is mocked, and spaCy is stubbed
      # with a blank pipeline so no language models are downloaded.
      - name: Run tests
        run: uv run pytest -q

      - name: Lint (flake8)
        run: uv run flake8 idiomapp tests

      - name: Check formatting (black)
        run: uv run black --check idiomapp tests
