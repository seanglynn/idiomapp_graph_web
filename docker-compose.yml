services:
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: idiomapp-streamlit
    ports:
      - "${STREAMLIT_SERVER_PORT:-8503}:${STREAMLIT_SERVER_PORT:-8503}"
    volumes:
      - .:/app
      - ./.env:/app/.env
      - ./docker/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    env_file:
      - .env
    depends_on:
      - ollama
    networks:
      - idiomapp-network

  ollama:
    image: ollama/ollama:latest
    container_name: idiomapp-ollama
    # No host port mapping: the streamlit service reaches this over the internal
    # Docker network at ollama:11434, and mapping 11434 to the host conflicts with
    # a native Ollama install already using that port there. Add back
    # "11434:11434" (or a different host port) if you need to reach this
    # container's Ollama directly from the host.
    volumes:
      - ./ollama-models:/root/.ollama
    networks:
      - idiomapp-network
    # Uncomment this section if you have an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  idiomapp-network:
    driver: bridge 